<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>四向快捷菜单</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Segoe UI","Microsoft YaHei",sans-serif;user-select:none}
body{box-sizing:border-box;padding:12px}
.ring{position:relative;width:208px;height:208px;opacity:0;cursor:pointer;filter:drop-shadow(0 6px 9px rgba(0,0,0,.22))}
.ring-photo{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
.action{position:absolute;box-sizing:border-box;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;color:rgba(226,231,238,.82);font-size:11px;font-weight:400;line-height:1.35;letter-spacing:.1px;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.35);overflow-wrap:anywhere;max-height:30px;transform:translate(-50%,-50%);pointer-events:none}
.up{left:50%;top:12.5%;width:86px}.down{left:50%;top:87.5%;width:86px}
.left{left:12.5%;top:50%;width:48px}.right{left:87.5%;top:50%;width:48px}
#cancel-menu{position:absolute;left:57px;top:57px;width:94px;height:94px;border:0;border-radius:50%;padding:0;background:transparent;color:rgba(210,218,226,.42);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.close-mark{font-size:20px;font-weight:300;line-height:1}.cancel-label{font-size:9px;letter-spacing:1px}
#cancel-menu:hover{color:rgba(229,234,240,.76)}
#cancel-menu:focus-visible{outline:1px solid rgba(229,234,240,.55);outline-offset:-12px}
.is-visible .ring{animation:ring-enter 480ms cubic-bezier(.22,.7,.25,1) both}
@keyframes ring-enter{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(prefers-reduced-motion:reduce){.is-visible .ring{animation-duration:1ms}}
</style>
<script defer src="quick-menu.js"></script>
</head>
<body>
<div class="ring" role="group" aria-label="四向快捷菜单，按方向键执行，点击取消">
<img class="ring-photo" src="remote-navigation-ring.png" alt="遥控器方向圆环" draggable="false">
<span class="action up" id="up">未设置</span>
<span class="action left" id="left">未设置</span>
<button id="cancel-menu" type="button" aria-label="取消四向快捷菜单" title="中心键、返回键或点击菜单取消"><span class="close-mark" aria-hidden="true">×</span><span class="cancel-label">取消</span></button>
<span class="action right" id="right">未设置</span>
<span class="action down" id="down">未设置</span>
</div>
</body>
</html>
